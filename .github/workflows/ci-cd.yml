name: CI CD

on:
  push:
    branches:
      - master
    paths-ignore:
      - "helm/platform-app/values.yaml"

  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: docker push $IMAGE:${{ github.sha }}

      - name: Update Helm image
        run: |
          sed -i "s|repository: .*|repository: $IMAGE|" helm/platform-app/values.yaml
          sed -i 's|tag: .*|tag: "${{ github.sha }}"|' helm/platform-app/values.yaml

      - name: Commit deployment update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/platform-app/values.yaml

          if git diff --cached --quiet; then
            echo "No deployment change"
            exit 0
          fi

          git commit -m "chore: deploy ${{ github.sha }} [skip ci]"
          git push