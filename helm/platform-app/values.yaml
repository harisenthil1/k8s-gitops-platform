replicaCount: 2

image:
  repository: ghcr.io/harisenthil1/k8s-gitops-platform
  tag: "f43052c15db419c98ddfbd7014d5252a06a335ec"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

secret:
  appApiKey: "demo-secret-change-me"

networkPolicy:
  enabled: true
